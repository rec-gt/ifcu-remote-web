<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iFCU Control</title>

    <style>
      * {
        font-family: sans-serif;
        box-sizing: border-box;
        color: #444;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        margin: 0;
        padding: 0;
        background: #a5dfff;
      }

      #parent {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .flex {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .w-full {
        width: 100%;
      }

      .center {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      option {
        background-color: #f9f9f9;
        color: #333;
        padding: 8px 12px;
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: 100%;
        max-width: 400px;
        border-radius: 10px;
        border: 2px #444 solid;
        background-color: #fff;
        padding: 1rem;
      }

      .bar {
        background-color: #f9f9f9;
        border-radius: 10px;
        padding: 0.5rem 1rem;
      }

      #on-off {
        display: flex;
        gap: 5px;
      }

      .on-off,
      .on-off-active {
        background-color: #ccc;
        color: #fff;
        border-radius: 5px;
        padding: 2.5px 5px;
        font-size: 12pt;
        cursor: pointer;
      }

      .on-off-active {
        background-color: #a5dfff;
      }

      .room-temp {
        width: 50%;
        height: 50px;
        font-size: 24pt;
      }

      .switch {
        width: 50px;
        cursor: pointer;
      }

      .arrow {
        border: solid black;
        border-width: 0 3px 3px 0;
        display: inline-block;
        padding: 3px;
      }

      .arrow-right {
        transform: rotate(-45deg);
        -webkit-transform: rotate(-45deg);
      }

      .arrow-left {
        transform: rotate(135deg);
        -webkit-transform: rotate(135deg);
      }

      .mode,
      .fan-speed {
        text-align: center;
        width: 120px;
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background-color: #f9f9f9;
        color: #333;
        font-size: 16px;
        cursor: pointer;
      }
    </style>

    <script>
      const DOMAIN = 'http://10.236.209.200';
      let finishInitFetch = false;

      let onOff = 0;
      let roomTemp = 0;
      let spt = 0;
      let mode = 0;
      let fanSpeed = 0;

      async function sendCMD(c) {
        try {
          const response = await fetch(`/cmd?c=${c}`);
        } catch (error) {
          console.error('Error in cmd:', error);
        }
      }

      function rerenderData() {
        document.getElementById('on-off').innerHTML = [
          `<div class="on-off" onclick="setOnOff(1)">ON</div>
              <div class="on-off-active" onclick="setOnOff(0)">OFF</div>`,
          `<div class="on-off-active" onclick="setOnOff(1)">ON</div>
              <div class="on-off" onclick="setOnOff(0)">OFF</div>`,
        ][onOff];
        document.getElementById('room-temp').textContent = (
          roomTemp / 100
        ).toFixed(2);
        document.getElementById('set-point').textContent = (spt / 100).toFixed(
          2,
        );
        document.getElementById('mode').value = mode;
        document.getElementById('fan-speed').value = fanSpeed;
      }

      async function setCmd(id, cmd) {
        await fetch(`${DOMAIN}/browser/set?id=${id}&cmd=${cmd}`);
      }

      async function setOnOff(id, power) {
        await fetch(`/broker/set-hr-browser?id=${id}&power=${power}`);
      }

      async function setSetPointTemperature(id, action) {
        if (action == 1) {
          await fetch(`/broker/set-hr-browser?id=${id}&setTempIncrease=1`);
        } else {
          await fetch(`/broker/set-hr-browser?id=${id}&setTempDecrease=1`);
        }
      }

      async function setMode(id, elem) {
        await fetch(`/broker/set-hr-browser?id=${id}&mode=${elem.value}`);
        isStopQuery = false;
      }

      async function setFanSpeed(id, elem) {
        await fetch(`/broker/set-hr-browser?id=${id}&speed=${elem.value}`);
        isStopQuery = false;
      }

      let isStopQuery = false;
      setInterval(() => {
        if (!isStopQuery) {
          fetchAll();
        }
      }, 1000);
    </script>

    <script>
      async function fetchAll() {
        try {
          const fullsetData = await fetch(`${DOMAIN}/browser/get`, {
            method: 'get',
          });
          renderAllData(await fullsetData.json());
        } catch (error) {
          console.error('Error in cmd:', error);
        }
      }

      function renderAllData(fullsetData) {
        const parent = document.getElementById('parent');
        parent.innerHTML = '';

        for (let i = 0; i < fullsetData.length; i++) {
          const [
            id,
            cmd,
            onOff,
            mode,
            speed,
            setTemp,
            roomTemp,
            isConn,
            loading,
          ] = fullsetData[i];
          console.log(
            id,
            cmd,
            onOff,
            mode,
            speed,
            setTemp,
            roomTemp,
            isConn,
            loading,
          );

          const header = `
              <div class="flex bar">
                <div>${id}</div>
                <div class="flex" style="gap: 1rem">
                    <div class="${onOff == 1 ? 'on-off-active' : 'on-off'}" onclick="setCmd('${id}','A')">ON</div>
                    <div class="${onOff == 0 ? 'on-off-active' : 'on-off'}" onclick="setCmd('${id}','B')">OFF</div>
                </div>
              </div>
            `;

          parent.innerHTML += `
            <div class="panel">
              ${header}

              <div>
                <div class="flex">
                  <div class="center">Room Temp.</div>
                  <div class="center">Set Point</div>
                </div>
                <div class="flex">
                  <div class="center">
                    <div class="center room-temp">
                      <div>${(roomTemp / 100).toFixed(1)}</div>
                      <div>°C</div>
                    </div>
                  </div>
                  <div class="center" style="justify-content: space-between">
                    <div class="switch" onclick="setCmd('${id}','J')"><i class="arrow arrow-left"></i></div>
                    <div id="set-point">${(setTemp / 100).toFixed(1)}</div>
                    <div>°C</div>
                    <div class="switch" onclick="setCmd('${id}','I')"><i class="arrow arrow-right"></i></div>
                  </div>
                </div>
              </div>

              <div>
                <div class="flex">
                  <div class="center">Mode</div>
                  <div class="center">Fan Speed</div>
                </div>
                <div class="flex">
                  <div class="center">
                    <div class="center" style="height: 50px">
                      <select class="mode" onfocus="isStopQuery=true" onfocusout="isStopQuery=false" onchange="setCmd('${id}',this.value)">
                        <option value="C" ${mode == 0 ? 'selected' : ''}>Auto</option>
                        <option value="D" ${mode == 1 ? 'selected' : ''}>Manual</option>
                        <option value="E" ${mode == 2 ? 'selected' : ''}>Fan</option>
                      </select>
                    </div>
                  </div>

                  <div class="center">
                    <div class="center" style="height: 50px">
                      <select class="fan-speed" onfocus="isStopQuery=true" onfocusout="isStopQuery=false" onchange="setCmd('${id}',this.value)">
                        <option value="F" ${speed == 0 ? 'selected' : ''}>Low</option>
                        <option value="G" ${speed == 1 ? 'selected' : ''}>Medium</option>
                        <option value="H" ${speed == 2 ? 'selected' : ''}>High</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </div>
      `;
        }
      }
    </script>
  </head>

  <body>
    <div style="padding: 1rem">
      <h1>iFCU Many-to-many Control Panel</h1>
      <div id="parent"></div>
    </div>
  </body>
</html>
