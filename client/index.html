<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iFCU Control</title>

    <style>
      * {
        font-family: sans-serif;
        box-sizing: border-box;
        color: #444;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        margin: 0;
        padding: 0;
        background: #a5dfff;
      }

      #parent {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .flex {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .w-full {
        width: 100%;
      }

      .center {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      option {
        background-color: #f9f9f9;
        color: #333;
        padding: 8px 12px;
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: 100%;
        max-width: 400px;
        border-radius: 10px;
        border: 2px #444 solid;
        background-color: #fff;
        padding: 1rem;
      }

      .bar {
        background-color: #f9f9f9;
        border-radius: 10px;
        padding: 0.5rem 1rem;
      }

      #on-off {
        display: flex;
        gap: 5px;
      }

      .on-off,
      .on-off-active {
        background-color: #ccc;
        color: #fff;
        border-radius: 5px;
        padding: 2.5px 5px;
        font-size: 12pt;
        cursor: pointer;
      }

      .on-off-active {
        background-color: #a5dfff;
      }

      .room-temp {
        width: 50%;
        height: 50px;
        font-size: 24pt;
      }

      .switch {
        width: 50px;
        cursor: pointer;
      }

      .arrow {
        border: solid black;
        border-width: 0 3px 3px 0;
        display: inline-block;
        padding: 3px;
      }

      .arrow-right {
        transform: rotate(-45deg);
        -webkit-transform: rotate(-45deg);
      }

      .arrow-left {
        transform: rotate(135deg);
        -webkit-transform: rotate(135deg);
      }

      .mode,
      .fan-speed {
        text-align: center;
        width: 120px;
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background-color: #f9f9f9;
        color: #333;
        font-size: 16px;
        cursor: pointer;
      }
    </style>

    <script>
      const DOMAIN = 'http://10.236.209.200';

      let localData = [];
      let remoteData = [];

      async function setCmd(id, cmd) {
        await fetch(`${DOMAIN}/browser/set?id=${id}&cmd=${cmd}`);
      }

      let isStopQuery = false;
      setInterval(() => {
        fetchAll();
      }, 1000);
    </script>

    <script>
      async function fetchAll() {
        try {
          const data = await fetch(`${DOMAIN}/browser/get`);
          syncData(await data.json());

          if (!isStopQuery) {
            renderPage();
          }
        } catch (error) {
          console.error('Error in cmd:', error);
        }
      }

      function syncData(data) {
        for (let i = 0; i < data.length; i++) {
          const [
            id,
            cmd,
            onOff,
            mode,
            speed,
            setTemp,
            roomTemp,
            isConn,
            loading,
          ] = data[i];
          if (loading === '0') {
            console.log('finish compromise');
            localData[i] = data[i];
          }
        }
      }

      function renderPage() {
        const parent = document.getElementById('parent');
        parent.innerHTML = '';

        for (let i = 0; i < localData.length; i++) {
          const [
            id,
            cmd,
            onOff,
            mode,
            speed,
            setTemp,
            roomTemp,
            isConn,
            loading,
          ] = localData[i];

          const header = `
              <div class="flex bar">
                <div>${id}</div>
                <div class="flex" style="gap: 1rem">
                    <div class="${onOff == 1 ? 'on-off-active' : 'on-off'}" onclick="setCmd('${id}','A')">ON</div>
                    <div class="${onOff == 0 ? 'on-off-active' : 'on-off'}" onclick="setCmd('${id}','B')">OFF</div>
                </div>
              </div>
            `;

          parent.innerHTML += `
            <div class="panel">
              ${header}

              <div>
                <div class="flex">
                  <div class="center">Room Temp.</div>
                  <div class="center">Set Point</div>
                </div>
                <div class="flex">
                  <div class="center">
                    <div class="center room-temp">
                      <div>${(roomTemp / 100).toFixed(1)}</div>
                      <div>°C</div>
                    </div>
                  </div>
                  <div class="center" style="justify-content: space-between">
                    <div class="switch" onclick="setCmd('${id}','J')"><i class="arrow arrow-left"></i></div>
                    <div id="set-point">${(setTemp / 100).toFixed(1)}</div>
                    <div>°C</div>
                    <div class="switch" onclick="setCmd('${id}','I')"><i class="arrow arrow-right"></i></div>
                  </div>
                </div>
              </div>

              <div>
                <div class="flex">
                  <div class="center">Mode</div>
                  <div class="center">Fan Speed</div>
                </div>
                <div class="flex">
                  <div class="center">
                    <div class="center" style="height: 50px">
                      <select class="mode" onfocus="isStopQuery=true" onfocusout="isStopQuery=false" onchange="setCmd('${id}',this.value)">
                        <option value="C" ${mode == 0 ? 'selected' : ''}>Auto</option>
                        <option value="D" ${mode == 1 ? 'selected' : ''}>Manual</option>
                        <option value="E" ${mode == 2 ? 'selected' : ''}>Fan</option>
                      </select>
                    </div>
                  </div>

                  <div class="center">
                    <div class="center" style="height: 50px">
                      <select class="fan-speed" onfocus="isStopQuery=true" onfocusout="isStopQuery=false" onchange="setCmd('${id}',this.value)">
                        <option value="F" ${speed == 0 ? 'selected' : ''}>Low</option>
                        <option value="G" ${speed == 1 ? 'selected' : ''}>Medium</option>
                        <option value="H" ${speed == 2 ? 'selected' : ''}>High</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </div>
      `;
        }
      }
    </script>
  </head>

  <body>
    <div style="padding: 1rem">
      <h1>iFCU Many-to-many Control Panel</h1>
      <div id="parent"></div>
    </div>
  </body>
</html>
