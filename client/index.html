<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iFCU Control</title>

    <style>
      * {
        font-family: sans-serif;
        box-sizing: border-box;
        color: #444;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        margin: 0;
        padding: 0;
        background: #a5dfff;
      }

      #parent {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .flex {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .w-full {
        width: 100%;
      }

      .center {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      option {
        background-color: #f9f9f9;
        color: #333;
        padding: 8px 12px;
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: 100%;
        max-width: 400px;
        border-radius: 10px;
        border: 2px #444 solid;
        background-color: #fff;
        padding: 1rem;
      }

      .bar {
        background-color: #f9f9f9;
        border-radius: 10px;
        padding: 0.5rem 1rem;
      }

      #on-off {
        display: flex;
        gap: 5px;
      }

      .on-off,
      .on-off-active {
        background-color: #ccc;
        color: #fff;
        border-radius: 5px;
        padding: 2.5px 5px;
        font-size: 12pt;
        cursor: pointer;
      }

      .on-off-active {
        background-color: #a5dfff;
      }

      .room-temp {
        width: 50%;
        height: 50px;
        font-size: 24pt;
      }

      .switch {
        width: 50px;
        cursor: pointer;
      }

      .arrow {
        border: solid black;
        border-width: 0 3px 3px 0;
        display: inline-block;
        padding: 3px;
      }

      .arrow-right {
        transform: rotate(-45deg);
        -webkit-transform: rotate(-45deg);
      }

      .arrow-left {
        transform: rotate(135deg);
        -webkit-transform: rotate(135deg);
      }

      .mode,
      .fan-speed {
        text-align: center;
        width: 120px;
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background-color: #f9f9f9;
        color: #333;
        font-size: 16px;
        cursor: pointer;
      }

      .rotate-svg {
        animation: rotation 2s linear infinite;
        transform-origin: center;
        will-change: transform;
      }

      @keyframes rotation {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <script>
      const DOMAIN = 'http://10.236.209.200';

      let localData = [];
      let remoteData = [];

      async function setCmd(id, cmd) {
        await fetch(`${DOMAIN}/browser/set?id=${id}&cmd=${cmd}`);

        // update locally
        const idx = localData.findIndex((e) => e[0] === id);
        let target = null;
        if (idx > -1) {
          target = localData[idx];
        }

        if (target) {
          console.log(cmd);
          if (cmd === 'A') {
            localData[idx][2] = '1';
          } else if (cmd === 'B') {
            localData[idx][2] = '0';
          } else if (cmd === 'C') {
            localData[idx][3] = '0';
          } else if (cmd === 'D') {
            localData[idx][3] = '1';
          } else if (cmd === 'E') {
            localData[idx][3] = '2';
          } else if (cmd === 'F') {
            localData[idx][4] = '0';
          } else if (cmd === 'G') {
            localData[idx][4] = '1';
          } else if (cmd === 'H') {
            localData[idx][4] = '2';
          } else if (cmd === 'I') {
            localData[idx][5] = (parseInt(localData[idx][5]) + 50).toString();
          } else if (cmd === 'J') {
            localData[idx][5] = (parseInt(localData[idx][5]) - 50).toString();
          }
        }
      }

      let isStopQuery = false;
      setInterval(() => {
        fetchAll();
      }, 1000);
    </script>

    <script>
      async function fetchAll() {
        try {
          const data = await fetch(`${DOMAIN}/browser/get`);
          const jsonData = await data.json();
          syncData(jsonData);
          renderData(jsonData);

          // if (!isStopQuery) {
          //   renderPage();
          // }
        } catch (error) {
          console.error('Error in cmd:', error);
        }
      }

      function syncData(data) {
        for (let i = 0; i < data.length; i++) {
          const [
            id,
            cmd,
            onOff,
            mode,
            speed,
            setTemp,
            roomTemp,
            isConn,
            loading,
          ] = data[i];
          if (loading === '0') {
            console.log('finish compromise');
            localData[i] = data[i];
            document.getElementById(`${id}-sync`).style.display = 'none';
          } else {
            document.getElementById(`${id}-sync`).style.display = 'block';
          }
        }
      }

      function renderPage() {
        const parent = document.getElementById('parent');
        parent.innerHTML = '';

        for (let i = 0; i < localData.length; i++) {
          const [
            id,
            cmd,
            onOff,
            mode,
            speed,
            setTemp,
            roomTemp,
            isConn,
            loading,
          ] = localData[i];

          const header = `
              <div class="flex bar">
                <div>${id}</div>
                <div class="flex" style="gap: 1rem">
                    <div class="${onOff == 1 ? 'on-off-active' : 'on-off'}" onclick="setCmd('${id}','A')">ON</div>
                    <div class="${onOff == 0 ? 'on-off-active' : 'on-off'}" onclick="setCmd('${id}','B')">OFF</div>
                </div>
              </div>
            `;

          parent.innerHTML += `
            <div class="panel">
              ${header}
              <div>
                <div class="flex">
                  <div class="center">Room Temp.</div>
                  <div class="center">Set Point</div>
                </div>
                <div class="flex">
                  <div class="center">
                    <div class="center room-temp">
                      <div>${(roomTemp / 100).toFixed(1)}</div>
                      <div>°C</div>
                    </div>
                  </div>
                  <div class="center" style="justify-content: space-between">
                    <div class="switch" onclick="setCmd('${id}','J')"><i class="arrow arrow-left"></i></div>
                    <div id="set-point">${(setTemp / 100).toFixed(1)}</div>
                    <div>°C</div>
                    <div class="switch" onclick="setCmd('${id}','I')"><i class="arrow arrow-right"></i></div>
                  </div>
                </div>
              </div>

              <div>
                <div class="flex">
                  <div class="center">Mode</div>
                  <div class="center">Fan Speed</div>
                </div>
                <div class="flex">
                  <div class="center">
                    <div class="center" style="height: 50px">
                      <select class="mode" onfocus="isStopQuery=true" onfocusout="isStopQuery=false" onchange="setCmd('${id}',this.value)">
                        <option value="C" ${mode == 0 ? 'selected' : ''}>Auto</option>
                        <option value="D" ${mode == 1 ? 'selected' : ''}>Manual</option>
                        <option value="E" ${mode == 2 ? 'selected' : ''}>Fan</option>
                      </select>
                    </div>
                  </div>

                  <div class="center">
                    <div class="center" style="height: 50px">
                      <select class="fan-speed" onfocus="isStopQuery=true" onfocusout="isStopQuery=false" onchange="setCmd('${id}',this.value)">
                        <option value="F" ${speed == 0 ? 'selected' : ''}>Low</option>
                        <option value="G" ${speed == 1 ? 'selected' : ''}>Medium</option>
                        <option value="H" ${speed == 2 ? 'selected' : ''}>High</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </div>
      `;
        }
      }
    </script>

    <script>
      function preRender() {
        const parent = document.getElementById('parent');
        parent.innerHTML = '';

        for (const id of ['ifcu-001', 'ifcu-002', 'ifcu-003']) {
          const header = `
              <div class="flex bar">
                <div>${id}</div>
                <div class="flex" style="gap: 1rem">
                    <svg id="${id}-sync" class="rotate-svg" width="20px" height="20px" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="#00FF00"><path fill-rule="evenodd" clip-rule="evenodd" d="M2.006 8.267L.78 9.5 0 8.73l2.09-2.07.76.01 2.09 2.12-.76.76-1.167-1.18a5 5 0 0 0 9.4 1.983l.813.597a6 6 0 0 1-11.22-2.683zm10.99-.466L11.76 6.55l-.76.76 2.09 2.11.76.01 2.09-2.07-.75-.76-1.194 1.18a6 6 0 0 0-11.11-2.92l.81.594a5 5 0 0 1 9.3 2.346z"/></svg>
                    <div id="${id}-on" class="on-off" onclick="setCmd('${id}','A')">ON</div>
                    <div id="${id}-off" class="on-off" onclick="setCmd('${id}','B')">OFF</div>
                </div>
              </div>
            `;

          const body = `
            <div class="panel">
              ${header}
              <div>
                <div class="flex">
                  <div class="center">Room Temp.</div>
                  <div class="center">Set Point</div>
                </div>
                <div class="flex">
                  <div class="center">
                    <div class="center room-temp">
                      <div id="${id}-roomTemp"></div>
                      <div>°C</div>
                    </div>
                  </div>
                  <div class="center" style="justify-content: space-between">
                    <div class="switch" onclick="setCmd('${id}','J')"><i class="arrow arrow-left"></i></div>
                    <div id="${id}-setTemp"></div>
                    <div>°C</div>
                    <div class="switch" onclick="setCmd('${id}','I')"><i class="arrow arrow-right"></i></div>
                  </div>
                </div>
              </div>

              <div>
                <div class="flex">
                  <div class="center">Mode</div>
                  <div class="center">Fan Speed</div>
                </div>
                <div class="flex">
                  <div class="center">
                    <div class="center" style="height: 50px">
                      <select id="${id}-mode" class="mode" onchange="setCmd('${id}',this.value)">
                        <option value="C">Auto</option>
                        <option value="D">Manual</option>
                        <option value="E">Fan</option>
                      </select>
                    </div>
                  </div>

                  <div class="center">
                    <div class="center" style="height: 50px">
                      <select id="${id}-speed" class="fan-speed" onchange="setCmd('${id}',this.value)">
                        <option value="F">Low</option>
                        <option value="G">Medium</option>
                        <option value="H">High</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            `;

          parent.innerHTML += body;
        }
      }

      function renderData() {
        for (const data of localData) {
          const id = data[0];
          const onOff = data[2];
          const mode = data[3];
          const speed = data[4];
          const setTemp = data[5];
          const roomTemp = data[6];
          const sync = data[8];

          if (onOff === '1') {
            document.getElementById(`${id}-on`).classList.add('on-off-active');
            document
              .getElementById(`${id}-off`)
              .classList.remove('on-off-active');
          }

          if (onOff === '0') {
            document
              .getElementById(`${id}-on`)
              .classList.remove('on-off-active');
            document.getElementById(`${id}-off`).classList.add('on-off-active');
          }

          document.getElementById(`${id}-roomTemp`).innerHTML = (
            parseInt(roomTemp) / 100
          ).toFixed(1);

          document.getElementById(`${id}-setTemp`).innerHTML = (
            parseInt(setTemp) / 100
          ).toFixed(1);

          document.getElementById(`${id}-mode`).value = ['C', 'D', 'E'][mode];
          document.getElementById(`${id}-speed`).value = ['F', 'G', 'H'][speed];
        }
      }
    </script>
  </head>

  <body>
    <div style="padding: 1rem">
      <h1>iFCU Many-to-many Control Panel</h1>
      <div id="parent"></div>
    </div>
  </body>

  <script>
    preRender();
  </script>
</html>
